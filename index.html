<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snowglobe!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    <header class = "hero">
      <h1>Snowglobe</h1>
      <p class = "tagline">Shake the globe for a little winter kindness</p>
    
    </header>

    <main>
        <section class = "globe-card">
            <div class = "globe" id ="globe">
                <img class="scene" src="assets/snowglobe.png" alt="snowglobe scene" />
            </div>
            <button id="shake">
                Shake the Globe
            </button>
            <p class = "message" id = "message">Shake the globe and reveal what settles!</p>
        </section>
    </main>

    <footer>
        <p>Made by @qklnxm</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
